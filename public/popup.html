<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>X Video Downloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" width="28" height="28" alt="" />
      <h1>X Video Downloader</h1>
      <button id="clear" title="Clear finished tasks" aria-label="Clear finished tasks"></button>
    </header>
    <main id="jobs" aria-live="polite"></main>
    <footer>
      <span id="summary"></span
      ><button
        id="downloads"
        title="Open Chrome downloads"
        aria-label="Open Chrome downloads"
      ></button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
